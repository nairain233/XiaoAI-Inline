[versions]
agp = "9.2.1"
xposed-api = "102.0.0"
xposed-service = "102.0.0"
autofill = "1.1.0"
junit = "4.13.2"
dexkit = "2.3.0"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }

[libraries]
